<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alequixia</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="console">
      <section class="assistant-card">
        <div class="brand">
          <div class="orb"><span>A</span></div>
          <div>
            <p>Alequixia</p>
            <span>Assistente inteligente local</span>
          </div>
          <strong id="providerBadge">...</strong>
        </div>

        <header class="hero">
          <div>
            <p class="eyebrow">Centro de comando</p>
            <h1>Como posso ajudar?</h1>
            <span>Peça respostas, abra aplicativos, navegue em sites e consulte o sistema.</span>
          </div>
        </header>

        <div class="quick-actions" aria-label="Acoes rapidas">
          <button type="button" data-prompt="abrir navegador">Navegador</button>
          <button type="button" data-prompt="abrir calculadora">Calculadora</button>
          <button type="button" data-prompt="status do sistema">Sistema</button>
          <button type="button" data-prompt="/memory.search alequixia">Memoria</button>
        </div>

        <div id="status" class="status-strip">Carregando...</div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="form" class="composer">
          <input id="input" autocomplete="off" placeholder="Digite uma tarefa, pergunta ou comando..." />
          <button type="submit">Enviar</button>
        </form>

        <div id="events" class="events"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
